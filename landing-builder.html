.lp .t-surface{--bg:#f5f5f5;--fg:#000000;--fg2:#666666;--line:#0000001e;--card:#ffffff;--card-b:#ebebeb;--p-bg:#0a0a0a;--p-fg:#fafafa;--p-h:#363636;--b2-bg:#ffffff;--b2-h:#fafafa;--b2-b:#0000001e;--acc:#ce7b1d;--ic-bg:#f3e6d8;--ic-fg:#7f501a}
.lp .t-mist   {--bg:#f0f5f7;--fg:#000000;--fg2:#666666;--line:#0000001e;--card:#ffffff;--card-b:#00000014;--p-bg:#0a0a0a;--p-fg:#fafafa;--p-h:#363636;--b2-bg:#ffffff;--b2-h:#fafafa;--b2-b:#0000001e;--acc:#1566ad;--ic-bg:#d6e7f5;--ic-fg:#123859}
.lp .t-gold   {--bg:#f8f3ed;--fg:#000000;--fg2:#666666;--line:#0000001e;--card:#ffffff;--card-b:#f3e6d8;--p-bg:#0a0a0a;--p-fg:#fafafa;--p-h:#363636;--b2-bg:#ffffff;--b2-h:#fcfbfa;--b2-b:#0000001e;--acc:#a6661b;--ic-bg:#f3e6d8;--ic-fg:#7f501a}
.lp .t-dark   {--bg:#000000;--fg:#ffffff;--fg2:#a8a8a8;--line:#ffffff1e;--card:#0f0f0f;--card-b:#363636;--p-bg:#ffffff;--p-fg:#0a0a0a;--p-h:#ebebeb;--b2-bg:#ffffff0f;--b2-h:#ffffff14;--b2-b:#ffffff1e;--acc:#e5902e;--ic-bg:#332417;--ic-fg:#ffb570}

.lp-s{background:var(--bg);color:var(--fg);padding-block:96px}
.lp-in{max-width:1168px;margin-inline:auto;padding-inline:24px}
.lp-eyebrow{font-size:14px;line-height:20px;font-weight:700;color:var(--acc)}
.lp-h1{font-size:48px;line-height:56px;font-weight:800;text-wrap:balance}
.lp-h2{font-size:40px;line-height:48px;font-weight:800;text-wrap:balance}
.lp-h3{font-size:20px;line-height:28px;font-weight:700}
.lp-lead{font-size:18px;line-height:32px;color:var(--fg2);max-width:36em}
.lp-p{font-size:14px;line-height:24px;color:var(--fg2)}
.lp-head{display:flex;flex-direction:column;gap:12px;max-width:720px;margin-bottom:48px}
.lp-head .lp-lead{font-size:16px;line-height:28px}

.lp-btns{display:flex;flex-wrap:wrap;gap:12px}
.lp-btn{display:inline-flex;align-items:center;justify-content:center;height:52px;padding-inline:28px;border-radius:16px;font-size:16px;line-height:22px;font-weight:700;transition:background .15s}
.lp-btn-1{background:var(--p-bg);color:var(--p-fg)}
.lp-btn-1:hover{background:var(--p-h)}
.lp-btn-2{background:var(--b2-bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--b2-b)}
.lp-btn-2:hover{background:var(--b2-h)}
.lp-btn-sm{height:40px;padding-inline:18px;border-radius:12px;font-size:14px}

.lp-art{aspect-ratio:4/3;border-radius:28px;background:radial-gradient(120% 90% at 30% 20%,#fcfbfa 0%,#f3e6d8 45%,#edbb83 100%);display:grid;place-items:center;overflow:hidden}
.lp-art img{width:28%;filter:drop-shadow(0 12px 24px #7f501a40)}
.t-dark .lp-art{background:radial-gradient(120% 90% at 30% 20%,#563815 0%,#2b1d0d 55%,#0a0a0a 100%)}
.lp-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:28px;background:var(--card)}

/* header */
.lp-s.sec-header{padding-block:16px;border-bottom:1px solid var(--line)}
.lp-bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.lp-logo{height:32px;width:auto}

/* hero */
.lp-s.sec-hero{padding-block:80px}
.lp-hero-row{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
.lp-hero-text{display:flex;flex-direction:column;gap:20px;align-items:flex-start;min-width:0}
.lp-hero-text .lp-btns{margin-top:12px}
.l-splitR .lp-media{order:-1}
.l-center .lp-hero-row{grid-template-columns:1fr;gap:56px}
.lp-hero-row.no-media{grid-template-columns:1fr}
.no-media .lp-hero-text{max-width:800px}
.l-center .lp-hero-text{align-items:center;text-align:center;max-width:800px;margin-inline:auto}
.l-center .lp-hero-text .lp-btns{justify-content:center}
.l-center .lp-img{aspect-ratio:16/7}

/* features */
.lp-grid{display:grid;gap:24px}
.l-grid3 .lp-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.l-grid2 .lp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.l-list .lp-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 48px}
.lp-feat{display:flex;flex-direction:column;gap:20px;background:var(--card);border:1px solid var(--card-b);border-radius:24px;padding:28px;min-width:0}
.lp-feat>div{display:flex;flex-direction:column;gap:8px}
.l-list .lp-feat{flex-direction:row;background:none;border:0;padding:0;gap:16px}
.lp-ic{width:52px;height:52px;border-radius:16px;background:var(--ic-bg);color:var(--ic-fg);display:grid;place-items:center;flex:none}
.lp-ic svg{width:26px;height:26px}

/* steps */
.lp-steps{list-style:none;position:relative;display:grid;gap:32px}
.l-row .lp-steps{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.l-row .lp-steps::before{content:"";position:absolute;top:24px;right:24px;left:24px;height:1px;background:var(--line)}
.lp-step{position:relative;display:flex;flex-direction:column;gap:20px;min-width:0}
.lp-step>div{display:flex;flex-direction:column;gap:8px}
.lp-num{width:48px;height:48px;border-radius:24px;background:var(--p-bg);color:var(--p-fg);display:grid;place-items:center;font-size:20px;font-weight:800;position:relative;font-variant-numeric:tabular-nums}
.l-column .lp-steps{max-width:720px;gap:0}
.l-column .lp-step{flex-direction:row;gap:20px;padding-bottom:36px}
.l-column .lp-step:last-child{padding-bottom:0}
.l-column .lp-step:not(:last-child)::before{content:"";position:absolute;top:48px;bottom:0;right:24px;width:1px;background:var(--line)}
.l-column .lp-step>div{padding-top:10px}

/* stats */
.lp-stats{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:24px}
.lp-stat{display:flex;flex-direction:column;gap:6px;min-width:0}
.lp-stat strong{font-size:40px;line-height:48px;font-weight:800;font-variant-numeric:tabular-nums}
.lp-stat span{font-size:16px;line-height:24px;color:var(--fg2)}
.l-row .lp-stat:not(:first-child){border-inline-start:1px solid var(--line);padding-inline-start:24px}
.l-cards .lp-stat{background:var(--card);border:1px solid var(--card-b);border-radius:24px;padding:28px}

/* media */
.lp-media-row{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:center}
.l-imgStart .lp-media{order:-1}
.lp-media-text{display:flex;flex-direction:column;gap:16px;align-items:flex-start;min-width:0}
.lp-media-text .lp-lead{font-size:16px;line-height:28px}
.lp-bullets{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:4px}
.lp-bullets li{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:24px}
.lp-bullets svg{color:var(--acc)}
.lp-media-text .lp-btns{margin-top:12px}

/* cta */
.lp-cta{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;max-width:760px;margin-inline:auto}
.lp-cta .lp-btns{justify-content:center;margin-top:12px}
.lp-cta-text{display:flex;flex-direction:column;gap:12px}
.l-inline .lp-cta{max-width:none;flex-direction:row;justify-content:space-between;text-align:start;gap:32px;background:var(--card);border:1px solid var(--card-b);border-radius:28px;padding:48px}
.l-inline .lp-cta .lp-btns{margin:0;flex:none}
.l-inline .lp-h2{font-size:32px;line-height:40px}

/* faq */
.l-split .lp-faq{display:grid;grid-template-columns:1fr 1.6fr;gap:64px;align-items:start}
.l-split .lp-faq .lp-head{margin:0}
.l-single .lp-faq{max-width:800px;margin-inline:auto}
.l-single .lp-faq .lp-head{text-align:center;align-items:center;margin-inline:auto}
.lp-q{border-bottom:1px solid var(--line)}
.lp-q:first-child{border-top:1px solid var(--line)}
.lp-q summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:20px;font-size:18px;line-height:26px;font-weight:700}
.lp-q summary::-webkit-details-marker{display:none}
.lp-plus{width:28px;height:28px;border-radius:14px;background:var(--b2-bg);position:relative;flex:none;transition:transform .2s}
.lp-plus::before,.lp-plus::after{content:"";position:absolute;inset:0;margin:auto;width:12px;height:1.5px;background:currentColor;border-radius:1px}
.lp-plus::after{transform:rotate(90deg)}
.lp-q[open] .lp-plus{transform:rotate(45deg)}
.lp-a{padding-bottom:20px;font-size:16px;line-height:28px;color:var(--fg2);max-width:42em}

/* footer */
.lp-s.sec-footer{padding-block:40px}
.lp-foot{display:flex;flex-direction:column;gap:16px}
.lp-foot-text{font-size:12px;line-height:20px;color:var(--fg2);max-width:56em}
.lp-links{display:flex;flex-wrap:wrap;gap:8px 24px}
.lp-links a{font-size:14px;line-height:20px;font-weight:700}
.lp-links a:hover{color:var(--fg2)}

@container (max-width:960px){
  .l-grid3 .lp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lp-hero-row,.lp-media-row{gap:40px}
}
@container (max-width:760px){
  .lp-s{padding-block:56px}
  .lp-s.sec-hero{padding-block:40px 56px}
  .lp-in{padding-inline:20px}
  .lp-h1{font-size:32px;line-height:40px}
  .lp-h2,.l-inline .lp-h2{font-size:24px;line-height:32px}
  .lp-h3{font-size:18px;line-height:26px}
  .lp-lead{font-size:16px;line-height:28px}
  .lp-head{margin-bottom:32px}
  .lp-hero-row,.lp-media-row,.l-split .lp-faq{grid-template-columns:1fr;gap:32px}
  .lp-media{order:0!important}
  .l-split .lp-media,.l-splitR .lp-media{order:-1!important}
  .lp-hero-text .lp-btns,.lp-media-text .lp-btns,.lp-cta .lp-btns{width:100%;flex-direction:column}
  .lp-hero-text .lp-btns .lp-btn,.lp-media-text .lp-btns .lp-btn,.lp-cta .lp-btns .lp-btn{width:100%}
  .lp-img,.lp-art{border-radius:20px}
  .l-center .lp-img{aspect-ratio:4/3}
  .l-grid3 .lp-grid,.l-grid2 .lp-grid,.l-list .lp-grid{grid-template-columns:1fr;gap:16px}
  .l-list .lp-grid{gap:28px}
  .lp-feat{padding:20px;flex-direction:row;gap:16px;border-radius:20px}
  .lp-ic{width:44px;height:44px;border-radius:14px}
  .lp-ic svg{width:22px;height:22px}
  .l-row .lp-steps{grid-template-columns:1fr;gap:0}
  .l-row .lp-steps::before{display:none}
  .lp-step{flex-direction:row!important;gap:16px;padding-bottom:28px}
  .lp-step:last-child{padding-bottom:0}
  .lp-step:not(:last-child)::before{content:"";position:absolute;top:48px;bottom:0;right:24px;width:1px;background:var(--line)}
  .lp-step>div{padding-top:10px}
  .lp-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .l-row .lp-stat:not(:first-child){border:0;padding:0}
  .lp-stats.n3{grid-template-columns:1fr;gap:0}
  .lp-stats.n3 .lp-stat{flex-direction:row;align-items:baseline;justify-content:space-between;gap:16px;padding-block:16px}
  .l-row .lp-stats.n3 .lp-stat:not(:first-child){border-top:1px solid var(--line)}
  .l-cards .lp-stats.n3{gap:12px}
  .lp-stats.n3 .lp-stat span{text-align:end}
  .l-cards .lp-stat{padding:20px;border-radius:20px}
  .lp-stat strong{font-size:28px;line-height:36px}
  .lp-stat span{font-size:14px;line-height:20px}
  .l-inline .lp-cta{flex-direction:column;align-items:stretch;padding:28px 20px;border-radius:24px}
  .lp-q summary{font-size:16px;line-height:24px}
  .lp-a{font-size:14px;line-height:24px}
  .lp-logo{height:28px}
}

/* ---------- ذخیره‌سازی ----------
   حالت «مشترک»: فهرست لندینگ‌ها در پایگاه داده‌ی همین صفحه (کالکشن landings) و تصویرها در فایل‌های آن؛
   همه‌ی کسانی که به صفحه دسترسی دارند یک فهرست را می‌بینند.
   حالت «محلی»: وقتی صفحه بیرون از claude.ai باز شود، همه‌چیز در همین مرورگر می‌ماند. */
const OLD_KEY='zarpin-landing-builder-v1', IDX='zarpin-lb-index-v1', PK=id=>'zarpin-lb-page-'+id;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
const mem={};
let index=[];            // [{id,name,updated,updatedBy,created,createdBy}]
let mode='loading';      // loading | shared | local | unreachable
let db=null, assetsNS=null, userNS=null, myId=null, canWrite=true;
const COL='landings';

function normalize(p){
  p.meta=p.meta||{}; p.meta.utm=p.meta.utm||{};
  p.sections.forEach(s=>{ s.data=s.data||{}; Object.values(s.data).forEach(v=>{ if(Array.isArray(v)) v.forEach(b=>{ if(b&&'action' in b&&!ACTIONS[b.action]){b.action='url'; delete b.dl} }) }) });
  return p;
}
const validPage=p=>p&&Array.isArray(p.sections)&&p.sections.every(s=>SCHEMA[s.type]&&s.id&&s.data);

/* محلی */
function localIndex(){ try{return JSON.parse(lsGet(IDX)||'[]')||[]}catch(e){return []} }
function localGet(id){ try{const p=JSON.parse(lsGet(PK(id))); return validPage(p)?normalize(p):null}catch(e){return null} }
function localMigrateOld(){
  const old=lsGet(OLD_KEY); if(!old) return;
  try{const p=JSON.parse(old); if(validPage(p)){ const ix=localIndex(); const id=uid(); ix.unshift({id,name:p.meta?.name||'',updated:Date.now(),created:Date.now()}); lsSet(PK(id),JSON.stringify(normalize(p))); lsSet(IDX,JSON.stringify(ix)) }}catch(e){}
  lsDel(OLD_KEY);
}

function getPage(id){
  if(mem[id]) return mem[id];
  if(mode==='local'){ const p=localGet(id); if(p) return mem[id]=p }
  return null;
}

/* نوشتن در پایگاه داده: برای هر لندینگ یک نوشتن در هر لحظه، با کمی مکث بین تایپ‌ها */
const wq={}; // id -> {timer, writing, dirty}
let writeWarned=false;
function scheduleWrite(id,delay=700){
  const q=wq[id]||(wq[id]={});
  q.dirty=true; clearTimeout(q.timer);
  q.timer=setTimeout(()=>flush(id),delay);
}
async function flush(id){
  const q=wq[id]; if(!q||q.writing||!q.dirty) return;
  const p=mem[id], ent=index.find(x=>x.id===id); if(!p||!ent){q.dirty=false;return}
  q.dirty=false; q.writing=true;
  try{
    await db.collection(COL).doc(id).set({name:ent.name||'',updated:ent.updated,updatedBy:myId,created:ent.created||ent.updated,createdBy:ent.createdBy||myId,page:p});
    setSync('saved');
  }catch(e){
    setSync('error');
    if(!writeWarned){ writeWarned=true;
      toast(e&&e.code==='quota_exceeded'?'فضای ذخیره‌ی مشترک پر شده است؛ چند لندینگ قدیمی را حذف کنید.'
        :e&&e.code==='invalid_argument'?'تغییرها ذخیره نشد: یا دسترسی ویرایش ندارید یا حجم این لندینگ زیاد است.'
        :'اتصال به فهرست مشترک برقرار نیست؛ تغییرها پس از اتصال دوباره ذخیره می‌شوند.') }
    if(e&&(e.code==='unavailable'||e.code==='resource_exhausted')) setTimeout(()=>{q.dirty=true;flush(id)},3000+Math.random()*2000);
  }finally{ q.writing=false; if(q.dirty) flush(id) }
}
const pendingFor=id=>{const q=wq[id]; return !!(q&&(q.dirty||q.writing))};
addEventListener('pagehide',()=>Object.keys(wq).forEach(flush));

function putPage(id,p){
  mem[id]=p;
  let ent=index.find(x=>x.id===id);
  if(!ent){ent={id,created:Date.now(),createdBy:myId}; index.unshift(ent)}
  ent.updated=Date.now(); ent.updatedBy=myId; ent.name=p.meta.name||'';
  if(mode==='shared'){ setSync('saving'); scheduleWrite(id); return true }
  return lsSet(PK(id),JSON.stringify(p)) && lsSet(IDX,JSON.stringify(index));
}
function createPage(p){ const id=uid(); putPage(id,p); if(mode==='shared') flush(id); return id }
async function deletePage(id){
  const pos=index.findIndex(x=>x.id===id); const ent=index[pos], p=mem[id]||getPage(id);
  index.splice(pos,1); delete mem[id];
  if(mode==='shared'){ clearTimeout(wq[id]?.timer); delete wq[id]; try{await db.collection(COL).doc(id).delete()}catch(e){toast('حذف انجام نشد؛ دوباره امتحان کنید')} }
  else { lsDel(PK(id)); lsSet(IDX,JSON.stringify(index)) }
  return ()=>{ index.splice(Math.min(pos,index.length),0,ent); mem[id]=p; if(mode==='shared'){wq[id]={dirty:true};flush(id)} else {lsSet(PK(id),JSON.stringify(p)); lsSet(IDX,JSON.stringify(index))} };
}

/* وضعیت ذخیره در نوار بالا */
function setSync(s){
  const el=document.getElementById('syncState'); if(!el) return;
  if(mode!=='shared'){ el.textContent='ذخیره در همین مرورگر'; el.dataset.s='local'; return }
  el.dataset.s=s; el.textContent=s==='saving'?'در حال ذخیره…':s==='error'?'ذخیره نشد':'ذخیره شد';
}

/* راه‌اندازی */
async function initStore(){
  const C=window.claude;
  if(!C||typeof C.use!=='function'){ return startLocal() }
  db=await C.use('db').catch(()=>null);
  if(!db) return startLocal();
  [userNS,assetsNS]=await Promise.all([C.use('user').catch(()=>null),C.use('assets').catch(()=>null)]);
  myId=userNS?await userNS.id():null;
  const cw=userNS?await userNS.can('data.write'):null; canWrite=cw!==false;
  mode='shared'; let first=true;
  const timer=setTimeout(()=>{ if(first){ mode='unreachable'; route() } },10000);
  db.collection(COL).onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ clearTimeout(timer); if(mode==='unreachable') mode='shared' }
    const seen=new Set();
    snap.docs.forEach(d=>{
      const v=d.data(); if(!v||!validPage(v.page)) return; seen.add(d.id);
      let ent=index.find(x=>x.id===d.id); if(!ent){ent={id:d.id}; index.push(ent)}
      if(pendingFor(d.id)) return; // تغییرهای خود ما هنوز در راه است
      const remoteNewer=!ent.updated||v.updated>ent.updated||!mem[d.id];
      Object.assign(ent,{name:v.name,updated:v.updated,updatedBy:v.updatedBy,created:v.created,createdBy:v.createdBy});
      if(remoteNewer){
        mem[d.id]=normalize(JSON.parse(JSON.stringify(v.page)));
        if(d.id===curId&&!first&&v.updatedBy!==myId){ page=mem[d.id]; past=[]; future=[]; fixSel(); render(); toast('همکارتان این لندینگ را به‌روز کرد؛ نسخه‌ی تازه نمایش داده شد') }
      }
    });
    for(let i=index.length-1;i>=0;i--){ const id=index[i].id; if(!seen.has(id)&&!pendingFor(id)){ index.splice(i,1); delete mem[id]; if(id===curId){ toast('این لندینگ حذف شد'); curId=null; page=null } } }
    if(first&&!snap.metadata.fromCache){ first=false }
    if(page) setSync(pendingFor(curId)?'saving':'saved');
    if(!page||!curId) route(); else renderList();
  },err=>{ clearTimeout(timer); mode='unreachable'; route() });
  route();
}
function startLocal(){
  mode='local'; localMigrateOld(); index=localIndex();
  if(!index.length){ const p=sample(); const id=uid(); mem[id]=p; index=[{id,name:p.meta.name,updated:Date.now(),created:Date.now()}]; lsSet(PK(id),JSON.stringify(p)); lsSet(IDX,JSON.stringify(index)) }
  route();
}

/* انتقال لندینگ‌های همین مرورگر به فهرست مشترک */
async function migrateLocal(){
  const ix=localIndex(); let n=0;
  for(const e of ix){ const p=localGet(e.id); if(!p) continue;
    for(const s of p.sections){ if(s.data.image&&s.data.image.startsWith('data:')&&assetsNS){ try{ s.data.image=await uploadImage(s.data.image) }catch(err){} } }
    createPage(p); lsDel(PK(e.id)); n++ }
  lsDel(IDX); renderHome(); toast(`${toFa(n)} لندینگ به فهرست مشترک منتقل شد`);
}
async function uploadImage(dataUrl){
  const blob=await (await fetch(dataUrl)).blob();
  const r=await assetsNS.upload(blob);
  return '/_blob/'+r.id;
}
async function inlineImages(html){
  const urls=[...new Set([...html.matchAll(/src="(\/_blob\/[A-Za-z0-9]+)"/g)].map(m=>m[1]))];
  for(const u of urls){
    try{ const b=await (await fetch(u)).blob(); const d=await new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b)}); html=html.split(`src="${u}"`).join(`src="${d}"`) }catch(e){}
  }
  return html;
}

function minimal(name){
  const p=sample(); const keep=['header','hero','cta','footer'];
  p.sections=p.sections.filter(s=>keep.includes(s.type));
  const ids=new Set(p.sections.map(s=>s.id));
  p.sections.forEach(s=>{ if(s.data.buttons) s.data.buttons=s.data.buttons.filter(b=>b.action!=='scroll'||ids.has(b.target)) });
  p.meta={name,title:'',desc:'',utm:{}}; return p;
}

/* ---------- وضعیت ویرایشگر ---------- */
let curId=null, page=null, sel, device='desktop', preview=false, addOpen=false;
function withPage(p,fn){const s=page; page=p; try{return fn()}finally{page=s}}

let past=[],future=[],lastKey=null,lastT=0;
function snapshot(key){
  const now=Date.now();
  if(key&&key===lastKey&&now-lastT<1200){lastT=now;return}
  past.push(JSON.stringify(page)); if(past.length>100) past.shift();
  future=[]; lastKey=key||null; lastT=now;
}
let saveWarned=false;
function save(){
  if(!canWrite){ if(!saveWarned){saveWarned=true;toast('دسترسی شما فقط مشاهده است؛ تغییرها ذخیره نمی‌شوند.')} return }
  if(!putPage(curId,page)&&!saveWarned){saveWarned=true;toast('ذخیره در مرورگر ممکن نشد (احتمالاً حجم تصویرها زیاد است). پروژه را از «خروجی ← دانلود پروژه» نگه دارید.')}
}
function mutate(fn,key,opts={}){ snapshot(key); fn(); save(); render(opts); }
function undo(){ if(!past.length)return; future.push(JSON.stringify(page)); page=JSON.parse(past.pop()); lastKey=null; fixSel(); save(); render(); }
function redo(){ if(!future.length)return; past.push(JSON.stringify(page)); page=JSON.parse(future.pop()); lastKey=null; fixSel(); save(); render(); }
function fixSel(){ if(!page.sections.some(s=>s.id===sel)) sel=page.sections[0]?.id; }

const secById=id=>page.sections.find(s=>s.id===id);
const cur=()=>secById(sel);
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function setPath(o,p,v){const ks=p.split('.');const last=ks.pop();const t=ks.reduce((a,k)=>a[k],o);t[last]=v}
const fid=(sid,path)=>('f-'+sid+'-'+path).replace(/\./g,'-');
function secTitle(s){const d=s.data;return (d.title||d.text||(d.items&&d.items[0]&&(d.items[0].title||d.items[0].q))||'').replace(/\n/g,' ')||SCHEMA[s.type].label}

/* ---------- لینک‌ها ---------- */
const URL_RE=/^https:\/\/[^\s/$.?#][^\s]*\.[^\s]{2,}$/i;
function withUtm(u){
  const m=(page&&page.meta.utm)||{}; if(!m.source&&!m.medium&&!m.campaign) return u;
  try{const x=new URL(u); if(!x.searchParams.has('utm_source')){ if(m.source)x.searchParams.set('utm_source',m.source); if(m.medium)x.searchParams.set('utm_medium',m.medium); if(m.campaign)x.searchParams.set('utm_campaign',m.campaign);} return x.toString()}catch(e){return u}
}
function href(b){
  if(b.action==='url') return URL_RE.test(b.url||'')?withUtm(b.url):'#';
  if(b.action==='scroll') return b.target?'#s-'+b.target:'#';
  return '#';
}

/* ---------- رندر لندینگ ---------- */
const isOff=(s,k)=>!!(s.off&&s.off[k]);
const removable=fl=>(fl.type==='text'||fl.type==='area'||fl.type==='image')&&!fl.req&&!fl.fixed;
function view(s){const d={...s.data}; if(s.off) for(const k in s.off) if(s.off[k]) d[k]=''; return d}
function renderSection(s,ed){
  const sc=SCHEMA[s.type], d=view(s);
  const f=p=>ed?` data-f="${p}"`:'';
  const btns=(bs,sm)=>!bs||!bs.length?'':`<div class="lp-btns">${bs.map((b,i)=>`<a class="lp-btn ${i?'lp-btn-2':'lp-btn-1'}${sm?' lp-btn-sm':''}" href="${esc(href(b))}"${b.action==='url'?' target="_blank" rel="noopener"':''}${f('buttons.'+i+'.label')}>${esc(b.label||'دکمه')}</a>`).join('')}</div>`;
  const head=(tag='h2')=>(d.eyebrow||d.title||d.body)?`<div class="lp-head">${d.eyebrow?`<p class="lp-eyebrow"${f('eyebrow')}>${esc(d.eyebrow)}</p>`:''}${d.title?`<${tag} class="lp-h2"${f('title')}>${txt(d.title)}</${tag}>`:''}${d.body?`<p class="lp-lead"${f('body')}>${txt(d.body)}</p>`:''}</div>`:'';
  const pic=()=>d.image?`<img class="lp-img" src="${d.image}" alt="${esc(d.imageAlt)}"${f('image')}>`:`<div class="lp-art"${f('image')}><img src="${LOGO_GOLD}" alt=""></div>`;
  const logo=s.theme==='dark'?LOGO_WHITE:LOGO_BLACK;
  let inner='', tag='section';
  switch(s.type){
    case 'header': tag='header';
      inner=`<div class="lp-bar"><img class="lp-logo" src="${logo}" alt="زرپین">${btns(d.buttons,true)}</div>`; break;
    case 'hero':{
      const media=(!isOff(s,'image')&&(s.layout!=='center'||d.image))?`<div class="lp-media">${pic()}</div>`:'';
      inner=`<div class="lp-hero-row${media?'':' no-media'}"><div class="lp-hero-text">${d.eyebrow?`<p class="lp-eyebrow"${f('eyebrow')}>${esc(d.eyebrow)}</p>`:''}<h1 class="lp-h1"${f('title')}>${txt(d.title)}</h1>${d.body?`<p class="lp-lead"${f('body')}>${txt(d.body)}</p>`:''}${btns(d.buttons)}</div>${media}</div>`; break;}
    case 'features':
      inner=head()+`<div class="lp-grid">${d.items.map((it,i)=>`<div class="lp-feat"><span class="lp-ic"${f('items.'+i+'.icon')}>${icon(it.icon)}</span><div><h3 class="lp-h3"${f('items.'+i+'.title')}>${esc(it.title)}</h3><p class="lp-p"${f('items.'+i+'.body')}>${txt(it.body)}</p></div></div>`).join('')}</div>`; break;
    case 'steps':
      inner=head()+`<ol class="lp-steps" style="--n:${d.items.length}">${d.items.map((it,i)=>`<li class="lp-step"><span class="lp-num" aria-hidden="true">${toFa(i+1)}</span><div><h3 class="lp-h3"${f('items.'+i+'.title')}>${esc(it.title)}</h3>${it.body?`<p class="lp-p"${f('items.'+i+'.body')}>${txt(it.body)}</p>`:''}</div></li>`).join('')}</ol>`; break;
    case 'stats':
      inner=head()+`<div class="lp-stats n${d.items.length}" style="--n:${d.items.length}">${d.items.map((it,i)=>`<div class="lp-stat"><strong${f('items.'+i+'.value')}>${esc(it.value)}</strong><span${f('items.'+i+'.label')}>${esc(it.label)}</span></div>`).join('')}</div>`; break;
    case 'media':
      inner=`<div class="lp-media-row"><div class="lp-media-text">${d.eyebrow?`<p class="lp-eyebrow"${f('eyebrow')}>${esc(d.eyebrow)}</p>`:''}<h2 class="lp-h2"${f('title')}>${txt(d.title)}</h2>${d.body?`<p class="lp-lead"${f('body')}>${txt(d.body)}</p>`:''}${d.bullets&&d.bullets.length?`<ul class="lp-bullets">${d.bullets.map((b,i)=>`<li${f('bullets.'+i+'.text')}>${icon('check')}<span>${esc(b.text)}</span></li>`).join('')}</ul>`:''}${btns(d.buttons)}</div><div class="lp-media">${pic()}</div></div>`; break;
    case 'cta':
      inner=`<div class="lp-cta"><div class="lp-cta-text"><h2 class="lp-h2"${f('title')}>${txt(d.title)}</h2>${d.body?`<p class="lp-lead"${f('body')}>${txt(d.body)}</p>`:''}</div>${btns(d.buttons)}</div>`; break;
    case 'faq':
      inner=`<div class="lp-faq">${head()}<div class="lp-qs">${d.items.map((it,i)=>`<details class="lp-q"${i===0?' open':''}><summary${f('items.'+i+'.q')}>${esc(it.q)}<span class="lp-plus" aria-hidden="true"></span></summary><div class="lp-a"${f('items.'+i+'.a')}>${txt(it.a)}</div></details>`).join('')}</div></div>`; break;
    case 'footer': tag='footer';
      inner=`<div class="lp-foot"><img class="lp-logo" src="${logo}" alt="زرپین"><p class="lp-foot-text"${f('text')}>${txt(d.text)}</p>${d.links&&d.links.length?`<nav class="lp-links">${d.links.map((l,i)=>`<a href="${esc(URL_RE.test(l.url||'')?withUtm(l.url):'#')}" target="_blank" rel="noopener"${f('links.'+i+'.label')}>${esc(l.label)}</a>`).join('')}</nav>`:''}</div>`; break;
  }
  return `<${tag} id="s-${s.id}" class="lp-s sec-${s.type} t-${s.theme} l-${s.layout}"${ed?` data-sid="${s.id}" data-label="${sc.label}"`:''}><div class="lp-in">${inner}</div></${tag}>`;
}

/* ---------- اعتبارسنجی ---------- */
function issues(){
  const out=[];
  const ids=new Set(page.sections.map(s=>s.id));
  page.sections.forEach((s,si)=>{
    const sc=SCHEMA[s.type], d=s.data, where=`${toFa(si+1)}. ${sc.label}`;
    const add=(level,msg,path)=>out.push({sid:s.id,level,msg,where,path});
    const checkFields=(fields,obj,base,pre)=>fields.forEach(fl=>{
      const v=obj[fl.k], path=base+fl.k;
      if((fl.type==='text'||fl.type==='area')&&fl.req&&!String(v||'').trim()) add('err',`${pre}«${fl.label}» خالی است`,path);
      if(fl.type==='url'&&!URL_RE.test(v||'')) add('err',`${pre}«${fl.label}» باید با https:// شروع شود`,path);
    });
    sc.fields.forEach(fl=>{
      if(isOff(s,fl.k)) return;
      const v=d[fl.k], path='data.'+fl.k;
      if(fl.type==='text'||fl.type==='area'||fl.type==='url') checkFields([fl],d,'data.','');
      if(fl.type==='items'){
        if(v.length<fl.min) add('err',`حداقل ${toFa(fl.min)} ${fl.item} لازم است`,path);
        v.forEach((it,i)=>checkFields(fl.fields,it,`${path}.${i}.`,`${fl.item} ${toFa(i+1)}: `));
      }
      if(fl.type==='buttons'){
        if(v.length<fl.min) add('err','این سکشن به یک دکمه نیاز دارد',path);
        v.forEach((b,i)=>{
          const p=`${path}.${i}.`, n=i?'دکمه‌ی دوم':'دکمه‌ی اصلی';
          if(!b.label.trim()) add('err',`متن ${n} خالی است`,p+'label');
          if(b.action==='url'&&!URL_RE.test(b.url||'')) add('err',`لینک ${n} باید آدرس کامل با https:// باشد`,p+'url');
          if(b.action==='scroll'&&!ids.has(b.target)) add('err',`سکشن مقصد ${n} انتخاب نشده یا حذف شده`,p+'target');
        });
      }
      if(fl.type==='image'&&d.image&&!String(d.imageAlt||'').trim()) add('warn','برای تصویر، توضیح متنی (alt) بنویسید',path+'Alt');
    });
    if(s.type==='features'){
      const n=d.items.length;
      if(s.layout==='grid3'&&n%3!==0) add('warn',`با ${toFa(n)} ویژگی، چیدمان سه‌ستونه ردیف ناقص دارد؛ ${toFa(3)} یا ${toFa(6)} ویژگی بگذارید یا دوستونه انتخاب کنید`,'layout');
      if((s.layout==='grid2'||s.layout==='list')&&n%2!==0) add('warn',`با ${toFa(n)} ویژگی، چیدمان دوستونه ردیف ناقص دارد`,'layout');
    }
  });
  const cnt=page.sections.filter(s=>s.type==='hero').length;
  if(cnt>1) page.sections.filter(s=>s.type==='hero').slice(1).forEach(s=>out.push({sid:s.id,level:'warn',msg:'هر صفحه بهتر است فقط یک هیرو داشته باشد',where:SCHEMA.hero.label,path:'layout'}));
  return out;
}

const frame=$('#frame'), holder=$('#holder'), stage=$('#stage');
function render(o={}){
  renderCanvas();
  renderList();
  if(o.insp!==false) renderInsp();
  renderChecks();
  $('#undo').disabled=!past.length; $('#redo').disabled=!future.length;
  $('#pageName').textContent=page.meta.name||'';
}
function renderCanvas(){
  frame.className='frame '+device+(preview?'':' ed');
  frame.innerHTML=`<div class="lp">${page.sections.map(s=>renderSection(s,!preview)).join('')}</div>`;
  if(!preview){const el=frame.querySelector(`[data-sid="${sel}"]`); if(el) el.classList.add('sel');}
  fit();
}
function fit(){
  const w=device==='mobile'?390:1280;
  frame.style.width=w+'px';
  const avail=Math.max(280,stage.clientWidth-48);
  const k=Math.min(1,avail/w);
  frame.style.transform=`scale(${k})`;
  holder.style.width=(w*k)+'px';
  holder.style.height=(frame.offsetHeight*k)+'px';
}
new ResizeObserver(fit).observe(stage);
new ResizeObserver(fit).observe(frame);

function renderList(){
  const iss=issues();
  const n=page.sections.length;
  $('#secCount').textContent=toFa(n)+' سکشن';
  $('#secList').innerHTML=page.sections.map((s,i)=>{
    const sc=SCHEMA[s.type], pin=!!sc.pin;

function renderChecks(){
  const iss=issues(), errs=iss.filter(x=>x.level==='err').length;
  $('#ckList').innerHTML=iss.map((x,i)=>`<li><button type="button" class="ck${x.level==='warn'?' w':''}" data-ck="${i}"><b>${esc(x.where)}</b><span>${esc(x.msg)}</span></button></li>`).join('');
  $('#ckOk').hidden=iss.length>0;
  const b=$('#ckBadge'); b.hidden=!iss.length; b.textContent=toFa(iss.length);
  const eb=$('#errBadge'); eb.hidden=!errs; eb.textContent=toFa(errs);

}

/* inspector */
function fieldHTML(s,fl,path,val){
  const id=fid(s.id,path);
  const top=path==='data.'+fl.k;
  const opt=(fl.req||top)?'':' <i>اختیاری</i>';
  const rm=top&&removable(fl)?`<button type="button" class="b rm" data-op="field-off" data-k="${fl.k}" title="حذف از سکشن" aria-label="حذف ${fl.label}">${IC.del}</button>`:'';
  const cnt=v=>`<span class="cnt${(v||'').length>=fl.max?' full':''}" data-cnt="${id}">${toFa((v||'').length)}/${toFa(fl.max)}</span>`;
  switch(fl.type){
    case 'text': return `<div class="fld"><div class="fld-top"><label for="${id}">${fl.label}${opt}</label><span class="fld-r">${cnt(val)}${rm}</span></div><input type="text" id="${id}" maxlength="${fl.max}" value="${esc(val)}" data-path="${path}" data-max="${fl.max}"></div>`;
    case 'area': return `<div class="fld"><div class="fld-top"><label for="${id}">${fl.label}${opt}</label><span class="fld-r">${cnt(val)}${rm}</span></div><textarea id="${id}" rows="${fl.rows||3}" maxlength="${fl.max}" data-path="${path}" data-max="${fl.max}">${esc(val)}</textarea></div>`;
    case 'url': return `<div class="fld"><label for="${id}">${fl.label}</label><input type="url" class="ltr" id="${id}" value="${esc(val)}" placeholder="https://" data-path="${path}"></div>`;
    case 'icon': return `<div class="fld"><span class="lab">${fl.label}</span><div class="icons" id="${id}" tabindex="-1">${Object.keys(ICONS).map(k=>`<button type="button" data-op="set" data-path="${path}" data-v="${k}" aria-pressed="${val===k}" title="${ICON_NAMES[k]||k}" aria-label="${ICON_NAMES[k]||k}">${icon(k)}</button>`).join('')}</div></div>`;
    case 'image': {
      const alt=s.data[fl.k+'Alt']||'';
      return `<div class="fld"><div class="fld-top"><span class="lab">${fl.label}</span>${rm}</div>
        <div class="imgbox"><div class="th" style="${val?`background-image:url(${val})`:''}">${val?'':''}</div><div class="acts">
        <label class="b sm filebtn">${val?'تعویض تصویر':'انتخاب تصویر'}<input type="file" accept="image/png,image/jpeg,image/webp" id="${id}" data-img="${path}"></label>
        ${val?`<button type="button" class="b sm danger" data-op="set" data-path="${path}" data-v="">حذف</button>`:''}</div></div>
        <p class="hint">${val?'':'بدون تصویر، طرح طلایی زرپین نمایش داده می‌شود. '}تصویر خودکار به حداکثر ۱۶۰۰ پیکسل کوچک می‌شود و گوشه‌هایش گرد می‌شود.</p>
        ${val?`<div class="fld"><label for="${fid(s.id,path+'Alt')}">توضیح تصویر (alt)</label><input type="text" id="${fid(s.id,path+'Alt')}" maxlength="80" value="${esc(alt)}" data-path="${path}Alt" data-max="80"></div>`:''}</div>`;}
    case 'buttons': {
      const others=page.sections.filter(x=>!SCHEMA[x.type].pin||x.type==='footer');
      return `<div class="grp"><h3>${fl.label}<span class="muted">${toFa(val.length)} از ${toFa(fl.max)}</span></h3>
      ${val.map((b,i)=>{const p=`${path}.${i}`;return `<div class="card"><div class="card-h"><b>${i?'دکمه‌ی دوم':'دکمه‌ی اصلی'}</b><span class="tag">${i?'سبک فرعی':'سبک اصلی'}</span>${val.length>fl.min?`<button type="button" class="b sm ic ghost danger" data-op="arr-del" data-path="${path}" data-i="${i}" aria-label="حذف دکمه">${IC.del}</button>`:''}</div>
        <div class="fld"><div class="fld-top"><label for="${fid(s.id,p+'.label')}">متن دکمه</label><span class="cnt" data-cnt="${fid(s.id,p+'.label')}">${toFa(b.label.length)}/${toFa(24)}</span></div><input type="text" id="${fid(s.id,p+'.label')}" maxlength="24" value="${esc(b.label)}" data-path="${p}.label" data-max="24"></div>
        <div class="fld"><span class="lab">کار دکمه</span><div class="seg" role="group">${Object.entries(ACTIONS).map(([k,v])=>`<button type="button" data-op="set" data-path="${p}.action" data-v="${k}" aria-pressed="${b.action===k}">${v}</button>`).join('')}</div></div>
        ${b.action==='url'?`<div class="fld"><label for="${fid(s.id,p+'.url')}">آدرس</label><input type="url" class="ltr" id="${fid(s.id,p+'.url')}" value="${esc(b.url)}" placeholder="https://" data-path="${p}.url"><p class="hint">پارامترهای UTM صفحه خودکار به آدرس اضافه می‌شوند.</p></div>`:''}
        ${b.action==='scroll'?`<div class="fld"><label for="${fid(s.id,p+'.target')}">سکشن مقصد</label><select id="${fid(s.id,p+'.target')}" data-path="${p}.target"><option value="">انتخاب کنید</option>${others.map(x=>`<option value="${x.id}"${x.id===b.target?' selected':''}>${toFa(page.sections.indexOf(x)+1)}. ${SCHEMA[x.type].label}: ${esc(secTitle(x).slice(0,40))}</option>`).join('')}</select></div>`:''}
      </div>`}).join('')}
      ${val.length<fl.max?`<button type="button" class="b" data-op="btn-add" data-path="${path}">${IC.plus}${val.length?'افزودن دکمه‌ی دوم':'افزودن دکمه'}</button>`:''}</div>`;}
    case 'items': {
      return `<div class="grp"><h3>${fl.label}<span class="muted">${toFa(val.length)} از ${toFa(fl.max)}</span></h3>
      ${val.map((it,i)=>`<div class="card"><div class="card-h"><b>${fl.item} ${toFa(i+1)}</b>
        <button type="button" class="b sm ic ghost" data-op="arr-up" data-path="${path}" data-i="${i}" ${i?'':'disabled'} aria-label="بالا">${IC.up}</button>
        <button type="button" class="b sm ic ghost" data-op="arr-down" data-path="${path}" data-i="${i}" ${i<val.length-1?'':'disabled'} aria-label="پایین">${IC.down}</button>
        <button type="button" class="b sm ic ghost danger" data-op="arr-del" data-path="${path}" data-i="${i}" ${val.length>fl.min?'':'disabled'} aria-label="حذف">${IC.del}</button></div>
        ${fl.fields.map(sf=>fieldHTML(s,sf,`${path}.${i}.${sf.k}`,it[sf.k])).join('')}</div>`).join('')}
      ${val.length<fl.max?`<button type="button" class="b" data-op="item-add" data-path="${path}" data-fk="${fl.k}">${IC.plus}افزودن ${fl.item}</button>`:`<p class="hint">حداکثر ${toFa(fl.max)} ${fl.item} مجاز است.</p>`}</div>`;}
  }
  return '';
}
function renderInsp(){
  const s=cur(), el=$('#insp');
  if(!s){el.innerHTML='';return}
  const sc=SCHEMA[s.type];
  const lays=Object.entries(sc.layouts);
  const simple=sc.fields.filter(f=>f.type!=='items'&&f.type!=='buttons');
  const complex=sc.fields.filter(f=>f.type==='items'||f.type==='buttons');
  el.innerHTML=`<div class="in-head"><span class="in-kicker">${toFa(page.sections.indexOf(s)+1)}. ${sc.label}</span><h2>${esc(secTitle(s))}</h2></div>
  ${sc.pin?`<div class="grp"><div class="lock-note">${IC.lock}<span>${sc.pin==='top'?'هدر همیشه بالای صفحه است':'فوتر همیشه پایین صفحه است'} و جابه‌جا یا حذف نمی‌شود.</span></div></div>`:''}
  ${lays.length>1?`<div class="grp"><h3>لی‌اوت</h3><div class="lays">${lays.map(([k,v])=>`<button type="button" class="lay" data-op="layout" data-v="${k}" aria-pressed="${s.layout===k}" id="${fid(s.id,'layout')}${s.layout===k?'':'-'+k}">${laySvg(s.type,k)}${v}</button>`).join('')}</div></div>`:''}
  <div class="grp"><h3>رنگ پس‌زمینه</h3><div class="sws">${sc.themes.map(t=>`<button type="button" class="sw" data-op="theme" data-v="${t}" aria-pressed="${s.theme===t}"><i style="background:${THEMES[t].c}"></i>${THEMES[t].n}</button>`).join('')}</div></div>
  ${simple.length?`<div class="grp"><h3>محتوا</h3>${simple.filter(fl=>!isOff(s,fl.k)).map(fl=>fieldHTML(s,fl,'data.'+fl.k,s.data[fl.k])).join('')}
    ${simple.some(fl=>isOff(s,fl.k))?`<div class="addf"><span class="muted">افزودن به سکشن:</span>${simple.filter(fl=>isOff(s,fl.k)).map(fl=>`<button type="button" class="b sm" data-op="field-on" data-k="${fl.k}">${IC.plus}${fl.label}</button>`).join('')}</div>`:''}</div>`:''}
  ${complex.map(fl=>fieldHTML(s,fl,'data.'+fl.k,s.data[fl.k])).join('')}`;
}

/* ---------- رویدادها ---------- */
$('#secList').addEventListener('click',e=>{
  const li=e.target.closest('[data-sid]'); if(!li) return;
  const op=e.target.closest('[data-op]')?.dataset.op; const id=li.dataset.sid;
  const i=page.sections.findIndex(s=>s.id===id);
  if(op==='select'){ sel=id; render(); scrollToSec(id); return }
  if(op==='up'||op==='down'){ const j=op==='up'?i-1:i+1; mutate(()=>{const a=page.sections;[a[i],a[j]]=[a[j],a[i]]}); return }
  if(op==='dup'){ mutate(()=>{const c=JSON.parse(JSON.stringify(page.sections[i])); c.id=uid(); page.sections.splice(i+1,0,c); sel=c.id}); toast('سکشن تکثیر شد'); return }
  if(op==='del'){ const label=SCHEMA[page.sections[i].type].label; mutate(()=>{page.sections.splice(i,1); sel=page.sections[Math.min(i,page.sections.length-2)].id}); toast(`سکشن «${label}» حذف شد`,'بازگردانی',undo); }
});
$('#addBtn').addEventListener('click',()=>{addOpen=!addOpen; renderList()});
$('#addMenu').addEventListener('click',e=>{
  const t=e.target.closest('[data-add]')?.dataset.add; if(!t) return;
  const sc=SCHEMA[t];
  const data={};
  sc.fields.forEach(fl=>{
    if(fl.type==='items') data[fl.k]=Array.from({length:Math.max(fl.min,fl.k==='items'?3:0)},(_, i)=>fl.make()).slice(0,fl.max);
    else if(fl.type==='buttons') data[fl.k]=fl.min?[newBtn('شروع کنید')]:[];
    else if(fl.type==='image'){data.image='';data.imageAlt=''}
    else data[fl.k]='';
  });
  if(data.title!==undefined) data.title=sc.label;
  const off={}; sc.fields.forEach(fl=>{ if(removable(fl)&&fl.k!=='body'&&fl.type!=='image') off[fl.k]=true });
  const s={id:uid(),type:t,layout:Object.keys(sc.layouts)[0],theme:'light',data,off};
  mutate(()=>{
    let at=page.sections.findIndex(x=>x.id===sel)+1;
    const last=page.sections.length-1;
    if(at<1) at=1; if(at>last) at=last;
    page.sections.splice(at,0,s); sel=s.id;
  });
  addOpen=false; renderList();
  scrollToSec(s.id);
  toast(`سکشن «${sc.label}» اضافه شد`);
});
$('#ckList').addEventListener('click',e=>{
  const b=e.target.closest('[data-ck]'); if(!b) return;
  const x=renderChecks.list[+b.dataset.ck]; if(!x) return;
  sel=x.sid; render(); scrollToSec(x.sid); focusField(x.sid,x.path);
});

const insp=$('#insp');
insp.addEventListener('input',e=>{
  const t=e.target; const p=t.dataset.path; if(!p||t.tagName==='SELECT') return;
  const s=cur();
  mutate(()=>setPath(s,p,t.value),s.id+p,{insp:false});
  const c=insp.querySelector(`[data-cnt="${t.id}"]`);

    } else if(mode==='shared'&&url.length>180000){ return toast('برای افزودن تصویر به دسترسی ویرایش یا مشارکت نیاز دارید.') }

insp.addEventListener('click',e=>{
  const b=e.target.closest('[data-op]'); if(!b||b.disabled) return;
  const s=cur(), op=b.dataset.op, p=b.dataset.path, i=+b.dataset.i;
  if(op==='layout') return mutate(()=>{s.layout=b.dataset.v});

  if(op==='field-off'){ const k=b.dataset.k, fl=SCHEMA[s.type].fields.find(f=>f.k===k); mutate(()=>{s.off={...(s.off||{}),[k]:true}}); return toast(`«${fl.label}» از سکشن حذف شد`,'بازگردانی',undo) }
  if(op==='field-on'){ const k=b.dataset.k; mutate(()=>{s.off={...(s.off||{})}; delete s.off[k]}); return setTimeout(()=>focusField(s.id,'data.'+k),0) }
  if(op==='set') return mutate(()=>setPath(s,p,b.dataset.v));
  if(op==='btn-add') return mutate(()=>getPath(s,p).push(newBtn()));
  if(op==='item-add'){ const fl=SCHEMA[s.type].fields.find(f=>f.k===b.dataset.fk); return mutate(()=>getPath(s,p).push(fl.make())) }
  if(op==='arr-del') return mutate(()=>getPath(s,p).splice(i,1));
  if(op==='arr-up'||op==='arr-down'){ const j=op==='arr-up'?i-1:i+1; return mutate(()=>{const a=getPath(s,p);[a[i],a[j]]=[a[j],a[i]]}) }
});

function shrink(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image(); im.onload=()=>{
      const k=Math.min(1,1600/Math.max(im.width,im.height));
      const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      let u=c.toDataURL('image/webp',0.85); if(!u.startsWith('data:image/webp')) u=c.toDataURL('image/jpeg',0.86);
      res(u)}; im.onerror=rej; im.src=r.result};
    r.onerror=rej; r.readAsDataURL(file);
  });
}

frame.addEventListener('click',e=>{

  if(preview){ if(a) toast(a.getAttribute('href').startsWith('#')?'این دکمه سکشن مقصد ندارد':'در صفحه‌ی منتشرشده باز می‌شود: '+a.getAttribute('href')); return }
  if(e.target.closest('summary')&&!e.target.closest('.sel')) e.preventDefault();
  const secEl=e.target.closest('[data-sid]'); if(!secEl) return;
  const id=secEl.dataset.sid, fEl=e.target.closest('[data-f]');

function focusField(sid,path){

  el.scrollIntoView({block:'center',behavior:'smooth'});
  if(el.focus) el.focus({preventScroll:true});
  const box=el.closest('.fld')||el; box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash');
}
function scrollToSec(id,smooth){
  const el=frame.querySelector(`#s-${CSS.escape(id)}`); if(!el) return;
  const k=frame.getBoundingClientRect().height/frame.offsetHeight||1;
  const c=$('#canvas');
  const top=el.getBoundingClientRect().top-c.getBoundingClientRect().top+c.scrollTop-24;
  c.scrollTo({top:Math.max(0,top),behavior:smooth||matchMedia('(prefers-reduced-motion:no-preference)').matches?'smooth':'auto'});
}

/* toast */
let tTimer;
function toast(msg,actLabel,act){
  const t=$('#toast'); $('#toastMsg').textContent=msg; const b=$('#toastAct');
  b.hidden=!actLabel; if(actLabel){b.textContent=actLabel; b.onclick=()=>{t.hidden=true; act()}}
  t.hidden=false; clearTimeout(tTimer); tTimer=setTimeout(()=>t.hidden=true,actLabel?6000:2600);
}

const fmtDate=t=>{try{return new Date(t).toLocaleString('fa-IR',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
function renderHome(){
  const grid=$('#lgrid'), q=$('#homeSearch').value.trim();
  $('#newLanding').hidden=!canWrite; $('#importWrap').hidden=!canWrite;
  const banner=$('#homeBanner');
  const localN=mode==='shared'&&canWrite?localIndex().length:0;
  banner.hidden=!(localN||mode==='unreachable'||!canWrite);
  banner.innerHTML=mode==='unreachable'?'<span>فهرست مشترک در دسترس نیست. اتصال را بررسی کنید و صفحه را دوباره باز کنید.</span>'
    :!canWrite?'<span>دسترسی شما فقط مشاهده است. برای ساختن و ویرایش لندینگ، از صاحب این صفحه دسترسی «مشارکت» بگیرید.</span>'
    :localN?`<span>${toFa(localN)} لندینگ فقط در همین مرورگر ذخیره شده و همکارانتان آن را نمی‌بینند.</span><button type="button" class="b sm pri" id="migrateBtn">انتقال به فهرست مشترک</button>`:'';
  $('#homeNote').textContent=mode==='local'?'این نسخه بیرون از claude.ai باز شده؛ لندینگ‌ها فقط در همین مرورگر ذخیره می‌شوند.':mode==='shared'?'این فهرست بین همه‌ی کسانی که به این صفحه دسترسی دارند مشترک است و تغییرها خودکار ذخیره می‌شوند.':'';
  if(mode==='loading'){ $('#homeCount').textContent='در حال بارگذاری…'; grid.innerHTML=Array.from({length:3},()=>'<div class="lskel"></div>').join(''); return }
  const list=index.filter(x=>getPage(x.id)).sort((a,b)=>(b.updated||0)-(a.updated||0));
  const shown=list.filter(x=>!q||(x.name||'').includes(q));
  $('#homeCount').textContent=`${toFa(list.length)} لندینگ`;
  const newCard=(!q&&canWrite)?`<button type="button" class="lnew" data-op="new"><span>${IC.plus}</span>لندینگ جدید</button>`:'';
  if(!list.length){ grid.innerHTML=newCard+`<div class="home-empty"><b>هنوز لندینگی ساخته نشده</b><span>${canWrite?'با «لندینگ جدید» از نمونه‌ی کامل یا حداقلی شروع کنید. هر لندینگی که بسازید برای همه‌ی تیم این‌جا دیده می‌شود.':'وقتی همکارانتان لندینگی بسازند، این‌جا نمایش داده می‌شود.'}</span></div>`; return }
  grid.innerHTML=newCard+(shown.length?shown.map(x=>{
    const p=getPage(x.id);
    const iss=withPage(p,issues), errs=iss.filter(i=>i.level==='err').length, warns=iss.length-errs;
    const thumb=withPage(p,()=>p.sections.slice(0,4).map(s=>renderSection(s,false)).join(''));
    const name=esc(p.meta.name||'بدون نام');
    return `<article class="lcard" data-id="${x.id}">
      <button type="button" class="lc-open" data-op="open" tabindex="-1" aria-hidden="true"><div class="lc-thumb"><div class="lc-scale"><div class="lp">${thumb}</div></div></div></button>
      <div class="lc-body"><div class="lc-top"><h2><button type="button" data-op="open">${name}</button></h2>
        ${canWrite?`<div class="lc-acts"><button type="button" class="b" data-op="dup" title="تکثیر" aria-label="تکثیر ${name}">${IC.dup}</button><button type="button" class="b danger" data-op="del" title="حذف" aria-label="حذف ${name}">${IC.del}</button></div>`:''}</div>
        <div class="lc-meta"><span>${toFa(p.sections.length)} سکشن</span><span aria-hidden="true">·</span><span>ویرایش ${fmtDate(x.updated)}</span>${x.updatedBy?`<span class="lc-who" data-uid="${esc(x.updatedBy)}"></span>`:''}</div>
        ${errs?`<span class="pill err">${toFa(errs)} خطا مانده</span>`:warns?`<span class="pill w">آماده، با ${toFa(warns)} هشدار</span>`:`<span class="pill ok">آماده‌ی خروجی</span>`}
      </div></article>`}).join(''):`<p class="home-empty">لندینگی با نام «${esc(q)}» پیدا نشد.</p>`);
  fitThumbs(); fillNames();

/* ---------- مسیریابی ---------- */
function go(id){ try{ location.hash=id?'l-'+id:'' }catch(e){} route(id||null) }
$('#backHome').onclick=()=>go(null);
function route(want){
  const h=/^#l-([a-z0-9]+)$/.exec(location.hash);
  const id=want!==undefined?want:(h?h[1]:null);
  const p=id&&getPage(id);
  if(p){
    if(curId!==id){ curId=id; page=p; past=[]; future=[]; lastKey=null; preview=!canWrite; addOpen=false;
      $('#previewBtn').setAttribute('aria-pressed',preview); $('#previewBtn').classList.toggle('pri',preview);
      sel=(page.sections.find(s=>!SCHEMA[s.type].pin)||page.sections[0])?.id; }
    $('#home').hidden=true; $('#app').hidden=false; $('#app').classList.toggle('ro',!canWrite);
    document.title=(page.meta.name||'لندینگ')+' · لندینگ‌ساز زرپین';
    setSync('saved'); render(); $('#canvas').scrollTop=0;
  } else {
    if(curId&&mode==='shared') flush(curId);
    curId=null; page=null;
    $('#app').hidden=true; $('#home').hidden=false; document.title='لندینگ‌ساز زرپین';
    renderHome();
  }
}
addEventListener('hashchange',()=>route());
renderHome();
initStore();
})();
